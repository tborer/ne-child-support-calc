name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate runtime config (Stripe feature flag)
        env:
          ENABLE_STRIPE: ${{ vars.ENABLE_STRIPE }}
          STRIPE_PAYMENT_LINK_URL: ${{ vars.STRIPE_PAYMENT_LINK_URL }}
        run: |
          ENABLE_STRIPE_BOOL=false
          if [ "$ENABLE_STRIPE" = "true" ]; then
            ENABLE_STRIPE_BOOL=true
          fi
          cat > js/config.js <<EOF
          window.APP_CONFIG = {
            ENABLE_STRIPE: ${ENABLE_STRIPE_BOOL},
            STRIPE_PAYMENT_LINK_URL: "${STRIPE_PAYMENT_LINK_URL}"
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (static site — no build step needed)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
